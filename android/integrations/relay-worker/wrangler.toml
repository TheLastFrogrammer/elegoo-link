# Link Workshop relay (see README.md here and android/INTEGRATIONS.md).
name = "printer-relay"
main = "worker.js"
compatibility_date = "2025-06-01"

# Create the namespace with `npx wrangler kv namespace create LW` and paste its id here.
[[kv_namespaces]]
binding = "LW"
id = "PASTE_THE_NAMESPACE_ID"

# Secrets (never in this file):
#   npx wrangler secret put LW_SECRET   # the relay secret shown in the app (Settings › Automations & integrations › Other apps › Relay)
#   npx wrangler secret put READ_KEY    # any long random text your readers send
# To let anyone read without a key, set PUBLIC_READ = "true" under [vars] instead.
[vars]
PUBLIC_READ = "false"
