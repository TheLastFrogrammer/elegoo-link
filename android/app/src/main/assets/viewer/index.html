<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Toolpath</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg, #f2f5f6); touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    font: 15px/1.4 sans-serif; color: var(--ink, #17252c); text-align: center; }
</style>
</head>
<body>
<canvas id="view" role="img" aria-label="3D view of the toolpath. Use the layer slider and buttons below the view; Layer and line type information is in the panel."></canvas>
<div id="message"></div>
<!-- The cloud camera's video element: kept on screen (1 px) so the WebView keeps decoding it; it is drawn in the scene. -->
<div id="camera-video" style="position:absolute;left:0;top:0;width:2px;height:2px;opacity:0.01;overflow:hidden;pointer-events:none"></div>
<script src="viewer.js"></script>
</body>
</html>
