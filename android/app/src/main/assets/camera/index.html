<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src https: wss:;">
<title>Printer camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e6eef1; font: 15px sans-serif; }
  #video { position: absolute; inset: 0; }
  #status { position: absolute; left: 16px; right: 16px; bottom: 16px; text-align: center; text-shadow: 0 1px 3px #000; }
</style>
<script src="AgoraRTC_N-production.js"></script>
</head>
<body>
<div id="video"></div>
<div id="status">Starting…</div>
<script>
// Cloud camera: joins the printer's Agora RTC channel the way Elegoo's printer page does
// (ElegooSlicer resources/web/elegoolink/lan_service_web): live mode, VP8, channel = printer serial,
// token and numeric uid issued by Elegoo, client role "host", then plays the printer's video track.
let client = null, remote = null;
function send(message) { try { Android.postMessage(JSON.stringify(message)); } catch (e) {} }
// What happens in the channel, for the app's camera log (counts and states only; no ids).
function event(text) { send({ type: 'event', text: text }); }
function channelState() {
  const users = client ? client.remoteUsers : [];
  return users.length + ' other member' + (users.length === 1 ? '' : 's') + ' in the channel, ' + users.filter(u => u.hasVideo).length + ' sending video';
}
function status(text) { document.getElementById('status').textContent = text; send({ type: 'status', text: text }); }
function show(user) {
  remote = user;
  const box = document.getElementById('video'); box.innerHTML = '';
  user.videoTrack.play(box, { fit: 'contain' });
  status(''); send({ type: 'playing' });
}
// The printer stops sending after about 26 s per viewer (seen on a CC2, October 2026) and starts again for a new join:
// when it stops, the page leaves and joins again with the same access, so watching carries on after a short gap.
let lastArgs = null, resuming = false, resumes = 0;
async function resume(why) {
  if (resuming || !lastArgs) return;
  if (resumes >= 500) { status('The printer stopped its camera stream.'); return; }
  resuming = true; resumes++;
  event(why + '; joining again (' + resumes + ')');
  status('The printer paused its video. Reconnecting…');
  await stop();
  setTimeout(() => { resuming = false; if (lastArgs) start.apply(null, lastArgs); }, 800);
}
async function start(appId, channel, token, uid) {
  lastArgs = [appId, channel, token, uid];
  try {
    AgoraRTC.setLogLevel(3);
    try { AgoraRTC.disableLogUpload(); } catch (e) {}
    client = AgoraRTC.createClient({ mode: 'live', codec: 'vp8' });
    client.on('user-joined', () => event('a member joined the channel (' + channelState() + ')'));
    client.on('user-published', async (user, type) => {
      event('a member started sending ' + type);
      if (type !== 'video') return;
      try { await client.subscribe(user, 'video'); show(user); } catch (e) { event('subscribing to the video failed (' + ((e && (e.code || e.message)) || e) + ')'); }
    });
    client.on('user-unpublished', (user, type) => { if (type === 'video' && remote === user) { remote = null; resume('the printer stopped sending video'); } });
    client.on('user-left', (user) => { if (remote === user) { remote = null; resume('the printer left the channel'); } });
    client.on('connection-state-change', (current, previous, reason) => {
      event('connection ' + previous + ' -> ' + current + (reason ? ' (' + reason + ')' : ''));
      if (current === 'DISCONNECTED' && reason && reason !== 'LEAVE') status('Disconnected from the camera service (' + reason + ').');
    });
    status('Connecting to the camera…');
    await client.join(appId, channel, token, Number(uid));
    await client.setClientRole('host');
    for (const user of client.remoteUsers) {
      if (user.hasVideo) { await client.subscribe(user, 'video'); show(user); break; }
    }
    event('joined (' + channelState() + ')');
    if (!remote) status('Connected. Waiting for the printer to send video…');
    // Elegoo's page waits for the printer to appear, then for its video; a member already sending is subscribed right away.
    let checks = 0;
    const poll = setInterval(async () => {
      if (!client || remote) { clearInterval(poll); return; }
      checks++;
      for (const user of client.remoteUsers) if (user.hasVideo) { try { await client.subscribe(user, 'video'); show(user); } catch (e) {} clearInterval(poll); return; }
      if (checks === 20) { clearInterval(poll); event('after 20 s: ' + channelState()); status('The printer is not sending video. It may be off, offline, or its camera may be disabled.'); }
    }, 1000);
  } catch (e) {
    status('The camera could not start (' + ((e && (e.code || e.message)) || e) + ').');
  }
}
async function stop() { const c = client; client = null; remote = null; try { if (c) await c.leave(); } catch (e) {} }
// The app's own stop: no rejoining after it.
async function end() { lastArgs = null; await stop(); }
// forRecording: a picture for the running print's recording (smaller, kept by the app without asking) rather than one to save.
function snapshot(forRecording) {
  const type = forRecording ? 'picture' : 'snapshot';
  if (!remote || !remote.videoTrack) { send({ type: type, data: '' }); return; }
  const frame = remote.videoTrack.getCurrentFrameData();
  const canvas = document.createElement('canvas'); canvas.width = frame.width; canvas.height = frame.height;
  canvas.getContext('2d').putImageData(frame, 0, 0);
  send({ type: type, data: canvas.toDataURL('image/jpeg', forRecording ? 0.85 : 0.92) });
}
send({ type: 'ready' });
</script>
</body>
</html>
