<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printer</title>
<style>
  :root { --bg: #0e1417; --card: #182227; --ink: #e6eef1; --muted: #9fb3bb; --accent: #5fd4c4; --warn: #ffb4ab; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 24px; padding: 24px; min-height: 100vh; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 16px; } }
  .video { background: #000; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 240px; }
  .video img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .video p { color: var(--muted); padding: 24px; text-align: center; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 20px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .bar { height: 14px; background: #2a3a40; border-radius: 7px; overflow: hidden; margin: 12px 0 6px; }
  .bar div { height: 100%; background: var(--accent); width: 0; transition: width .6s; }
  .big { font-size: 44px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
  .grid b { display: block; font-size: 24px; }
  button { font: inherit; background: #21343a; color: var(--accent); border: 0; border-radius: 24px; padding: 14px 24px; cursor: pointer; }
  button:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
  .code { font-size: 64px; letter-spacing: 12px; font-weight: 700; margin: 8px 0; }
  .error { color: var(--warn); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="pairing" hidden>
  <div class="card" style="grid-column: 1 / -1; max-width: 720px; margin: auto;">
    <h1>Watch the printer here</h1>
    <p class="muted">This screen reads the printer through the Link Workshop app on your phone. It can watch, never control.</p>
    <button id="pair" autofocus>Pair this screen</button>
    <div id="waiting" hidden>
      <p>On the phone, open Link Workshop › Settings › Other apps and approve this screen. The phone shows the same code:</p>
      <div class="code" id="code"></div>
      <p class="muted" id="pairNote" aria-live="polite"></p>
    </div>
    <p class="error" id="pairError" role="alert"></p>
  </div>
</main>
<main id="watch" hidden>
  <div class="video" id="video"><p id="videoNote">Opening the camera…</p></div>
  <div class="side">
    <div class="card">
      <h1 id="state">…</h1>
      <div class="muted" id="file"></div>
      <div class="bar"><div id="progressBar"></div></div>
      <div class="big" id="progress"></div>
      <div class="muted" id="times"></div>
    </div>
    <div class="card grid" id="numbers"></div>
    <div class="card muted" id="connection" aria-live="polite"></div>
  </div>
</main>
<script>
"use strict";
const TOKEN = "linkWorkshopToken";
let token = null; try { token = localStorage.getItem(TOKEN); } catch (e) { }
const $ = (id) => document.getElementById(id);
// Each start of watching has its own number: the timers and streams of an earlier one stop by themselves, so retries
// never pile up on the phone. Waits double up to 30 s (60 s for the camera) and start again once things work.
let run = 0, events = null, picture = null, camera = "printer", wait = 3000, videoWait = 5000;
const longer = (ms, most) => Math.min(most, ms * 2);
const num = (x) => typeof x === "number" && isFinite(x);
function note(words) { const p = document.createElement("p"); p.textContent = words; return p; }

async function api(path, options = {}) {
  const headers = Object.assign({}, options.headers || {}, token ? { Authorization: "Bearer " + token } : {});
  const response = await fetch(path, Object.assign({}, options, { headers }));
  if (response.status === 401 && token) { forget(); throw new Error("not paired"); }
  return response;
}
function stopStreams() {
  if (events) { events.close(); events = null; }
  if (picture) { picture.onload = picture.onerror = null; picture.removeAttribute("src"); picture = null; }   // ends its stream
}
function forget() { token = null; run++; stopStreams(); try { localStorage.removeItem(TOKEN); } catch (e) { } showPairing(); }

function showPairing() { $("watch").hidden = true; $("pairing").hidden = false; $("pair").hidden = false; $("pair").disabled = false; $("pair").focus(); }
function pairFailed(words) { $("pairError").textContent = words; $("waiting").hidden = true; showPairing(); }
$("pair").addEventListener("click", async () => {
  $("pairError").textContent = ""; $("pair").disabled = true;
  try {
    const r = await fetch("/api/v1/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: "TV browser" }) });
    const p = await r.json().catch(() => ({}));
    if (!r.ok || typeof p.poll !== "string") { pairFailed(typeof p.error === "string" ? p.error : "Could not ask the phone."); return; }
    $("code").textContent = String(p.code); $("waiting").hidden = false; $("pair").hidden = true;
    const until = Date.now() + (num(p.expires_in) ? p.expires_in : 300) * 1000;
    const poll = async () => {
      if (Date.now() > until) { pairFailed("Not approved in time. Try again."); return; }
      $("pairNote").textContent = "Waiting for the phone… " + Math.round((until - Date.now()) / 1000) + " s left";
      let r2, s;
      try { r2 = await fetch(p.poll); s = await r2.json(); } catch (e) { setTimeout(poll, 4000); return; }   // the phone out of reach a moment
      if (s.state === "approved" && typeof s.token === "string") { token = s.token; try { localStorage.setItem(TOKEN, token); } catch (e) { } $("waiting").hidden = true; watch(); return; }
      if (s.state === "denied") { pairFailed("Refused on the phone."); return; }
      if (r2.status === 404) { pairFailed("The request ran out. Try again."); return; }
      setTimeout(poll, 2000);
    };
    poll();
  } catch (e) { pairFailed("Could not reach the phone."); }
});

async function ticket() { const r = await api("/api/v1/tickets", { method: "POST" }); if (!r.ok) throw new Error("no ticket"); return (await r.json()).ticket; }
/** Starts (or starts again) watching: the camera list, the camera and the event stream, as one run. */
async function watch() {
  if (!token) { showPairing(); return; }
  const mine = ++run; stopStreams();
  $("pairing").hidden = true; $("watch").hidden = false; $("video").replaceChildren(note("Opening the camera…"));
  try {
    const r = await api("/api/v1/cameras");
    const cams = r.ok ? ((await r.json()).cameras || []) : [];
    if (mine !== run) return;
    if (cams.length && typeof cams[0].id === "string") camera = cams[0].id;
    openVideo(mine); openEvents(mine);
  } catch (e) { again(mine); }
}
/** The phone could not be reached: everything starts again after a wait that grows. */
function again(mine) {
  if (mine !== run || !token) return;
  $("connection").textContent = "Can't reach the phone. Trying again…";
  setTimeout(() => { if (mine === run) watch(); }, wait); wait = longer(wait, 30000);
}
async function openVideo(mine) {
  let t; try { t = await ticket(); } catch (e) { if (mine === run && token) { setTimeout(() => { if (mine === run) openVideo(mine); }, videoWait); videoWait = longer(videoWait, 60000); } return; }
  if (mine !== run) return;
  const img = new Image(); img.alt = "The printer's camera"; picture = img;
  img.onload = () => { if (mine !== run) return; videoWait = 5000; if (img.parentNode !== $("video")) $("video").replaceChildren(img); };
  img.onerror = () => {
    if (mine !== run || picture !== img) return;
    img.removeAttribute("src"); picture = null;
    $("video").replaceChildren(note("The camera is not available right now. Trying again…"));
    setTimeout(() => { if (mine === run) openVideo(mine); }, videoWait); videoWait = longer(videoWait, 60000);
  };
  img.src = "/api/v1/cameras/" + encodeURIComponent(camera) + "/stream.mjpeg?fps=5&ticket=" + encodeURIComponent(t);
}
async function openEvents(mine) {
  let t; try { t = await ticket(); } catch (e) { again(mine); return; }
  if (mine !== run) return;
  const source = new EventSource("/api/v1/events?ticket=" + encodeURIComponent(t)); events = source;
  source.addEventListener("status", (e) => { if (mine !== run) return; wait = 3000; try { show(JSON.parse(e.data)); } catch (bad) { } });
  // Lost (the phone closed the app or lost the printer): the camera may have stopped too, so both start again.
  source.onerror = () => { source.close(); if (events === source) events = null; again(mine); };
}
function clock(seconds) { const h = Math.floor(seconds / 3600), m = Math.round(seconds % 3600 / 60); return h ? h + " h " + m + " min" : m + " min"; }
/** Shows a status. Everything from the phone is set as text, never as markup. */
function show(s) {
  const obj = (x) => x && typeof x === "object" ? x : {};
  const p = obj(s.print), t = obj(s.temperatures), f = obj(s.fans), state = obj(s.state), c = obj(s.connection);
  $("state").textContent = typeof state.words === "string" ? state.words : "…";
  $("file").textContent = typeof p.file === "string" ? p.file : "";
  const progress = num(p.progress) ? Math.max(0, Math.min(100, p.progress)) : null;
  $("progressBar").style.width = (progress || 0) + "%";
  $("progress").textContent = progress === null ? "" : progress + " %";
  const parts = [];
  if (num(p.layer) && num(p.total_layers) && p.total_layers > 0) parts.push("Layer " + p.layer + " of " + p.total_layers);
  if (num(p.remaining_s)) parts.push(clock(p.remaining_s) + " left");
  const done = typeof p.done_at === "string" ? new Date(p.done_at) : null;
  if (done && !isNaN(done)) parts.push("done about " + done.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
  $("times").textContent = parts.join(" · ");
  const numbers = $("numbers"); numbers.replaceChildren();
  const cell = (label, value) => {
    if (value === undefined) return;
    const d = document.createElement("div"), l = document.createElement("span"), b = document.createElement("b");
    l.className = "muted"; l.textContent = label; b.textContent = value; d.append(l, b); numbers.append(d);
  };
  const temp = (x) => x && num(x.now) ? Math.round(x.now) + (num(x.target) && x.target > 0 ? " / " + Math.round(x.target) : "") + " °C" : undefined;
  cell("Nozzle", temp(t.nozzle)); cell("Bed", temp(t.bed)); cell("Chamber", temp(t.chamber)); cell("Part fan", num(f.part) ? Math.round(f.part) + " %" : undefined);
  const faults = Array.isArray(state.faults) ? state.faults.filter((x) => typeof x === "string" || num(x)) : [];
  $("connection").textContent = (c.fresh === true ? "Live" : "No fresh status") + (typeof c.route === "string" ? " · " + c.route : "") + (faults.length ? " · faults " + faults.join(", ") : "");
}
if (token) watch(); else showPairing();
</script>
</body>
</html>
