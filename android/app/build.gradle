plugins { id 'com.android.application' }
android {
    namespace 'io.github.thelastfrogrammer.elink'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.thelastfrogrammer.elink'
        minSdk 26
        targetSdk 36
        versionCode 52
        versionName '0.19.0'
        // Agora ships native code for four CPU types; keep only 64-bit ARM (modern phones) to limit APK size.
        ndk { abiFilters 'arm64-v8a' }
    }
    // Release signing comes from the environment (CI secrets) or ~/.gradle/gradle.properties; never from the repository.
    def signingValue = { String name -> System.getenv(name) ?: (project.findProperty(name) ?: '') }
    def keystorePath = signingValue('LINK_WORKSHOP_KEYSTORE')
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword signingValue('LINK_WORKSHOP_KEYSTORE_PASSWORD')
                keyAlias signingValue('LINK_WORKSHOP_KEY_ALIAS')
                keyPassword signingValue('LINK_WORKSHOP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    // Compress native libraries in the APK (the slicer is 19 MB): a much smaller download for sideloading, unpacked
    // once at install.
    packaging { jniLibs { useLegacyPackaging = true } }
    testOptions { unitTests { includeAndroidResources = true; all {
        systemProperty 'screenshots', System.getProperty('screenshots', '')
        // Opt-in: -DslicerLib=<dir with a host liblinkslicer.so> runs SlicerIntegrationTest against the real engine.
        def slicerLib = System.getProperty('slicerLib', '')
        systemProperty 'slicerLib', slicerLib
        if (!slicerLib.isEmpty()) jvmArgs "-Djava.library.path=${slicerLib}"
    } } }
}
dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    // Agora RTM: Elegoo's cloud command channel (same major version as the SDK's bundled 2.2.8 native library).
    implementation 'io.agora:agora-rtm:2.2.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Only for opt-in UI screenshots (-Dscreenshots=<dir>); see ScreenshotTest.
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
