plugins { id 'com.android.application' }
android {
    namespace 'io.github.thelastfrogrammer.elink'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.thelastfrogrammer.elink'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.4.0'
        // Agora ships native code for four CPU types; keep only 64-bit ARM (modern phones) to limit APK size.
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    testOptions { unitTests { includeAndroidResources = true; all { systemProperty 'screenshots', System.getProperty('screenshots', '') } } }
}
dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    // Agora RTM: Elegoo's cloud command channel (same major version as the SDK's bundled 2.2.8 native library).
    implementation 'io.agora:agora-rtm:2.2.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Only for opt-in UI screenshots (-Dscreenshots=<dir>); see ScreenshotTest.
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
