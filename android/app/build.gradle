plugins { id 'com.android.application' }
android {
    namespace 'io.github.thelastfrogrammer.elink'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.thelastfrogrammer.elink'
        minSdk 26
        targetSdk 36
        versionCode 124
        versionName '0.46.3'
        // Agora ships native code for four CPU types; keep only 64-bit ARM (modern phones) to limit APK size.
        ndk { abiFilters 'arm64-v8a' }
    }
    // Release signing comes from the environment (CI secrets) or ~/.gradle/gradle.properties; never from the repository.
    def signingValue = { String name -> System.getenv(name) ?: (project.findProperty(name) ?: '') }
    def keystorePath = signingValue('LINK_WORKSHOP_KEYSTORE')
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword signingValue('LINK_WORKSHOP_KEYSTORE_PASSWORD')
                keyAlias signingValue('LINK_WORKSHOP_KEY_ALIAS')
                keyPassword signingValue('LINK_WORKSHOP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    // Compress native libraries in the APK (the slicer is 19 MB): a much smaller download for sideloading, unpacked
    // once at install.
    packaging { jniLibs { useLegacyPackaging = true } }
    testOptions { unitTests { includeAndroidResources = true; all {
        maxHeapSize = '2g'   // the render tests and the slicer engine
        systemProperty 'screenshots', System.getProperty('screenshots', '')
        // Opt-in: -DslicerLib=<dir with a host liblinkslicer.so> runs SlicerIntegrationTest against the real engine.
        def slicerLib = System.getProperty('slicerLib', '')
        systemProperty 'slicerLib', slicerLib
        if (!slicerLib.isEmpty()) jvmArgs "-Djava.library.path=${slicerLib}"
    } } }
}
// The slicer engine and its presets: built from slicer/ (slicer/scripts) and pinned in android/engine/ (pin-engine.sh), so every
// build, CI and releases included, ships the same engine. An engine installed locally by install-into-app.sh takes precedence.
def engineDir = rootProject.file('engine')
def engineZip = new File(engineDir, 'engine-arm64-v8a.zip')
def engineLib = file('src/main/jniLibs/arm64-v8a/liblinkslicer.so'), engineVersion = file('src/main/assets/slicer/VERSION')
tasks.register('unpackEngine') {
    onlyIf { engineZip.isFile() && !(engineLib.isFile() && engineVersion.isFile()) }
    doLast {
        def expected = new File(engineDir, 'engine-arm64-v8a.sha256').text.trim().split(/\s+/)[0]
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        engineZip.withInputStream { stream -> byte[] buffer = new byte[1 << 16]; int n; while ((n = stream.read(buffer)) > 0) digest.update(buffer, 0, n) }
        def actual = digest.digest().encodeHex().toString()
        if (actual != expected) throw new GradleException("The pinned engine does not match its checksum (${actual}); run slicer/scripts/pin-engine.sh again")
        def target = file('src/main').canonicalFile
        new java.util.zip.ZipFile(engineZip).withCloseable { zip ->
            zip.entries().each { entry ->
                def out = new File(target, entry.name).canonicalFile
                if (!out.path.startsWith(target.path + File.separator)) throw new GradleException("Unexpected path in the pinned engine: ${entry.name}")
                if (entry.directory) { out.mkdirs(); return }
                out.parentFile.mkdirs(); zip.getInputStream(entry).withCloseable { input -> out.withOutputStream { it << input } }
            }
        }
        logger.lifecycle("Unpacked the pinned slicer engine ${expected.take(12)} into src/main")
    }
}
tasks.named('preBuild') { dependsOn 'unpackEngine' }
dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    // Agora RTM: Elegoo's cloud command channel (same major version as the SDK's bundled 2.2.8 native library).
    implementation 'io.agora:agora-rtm:2.2.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Only for opt-in UI screenshots (-Dscreenshots=<dir>); see ScreenshotTest.
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
