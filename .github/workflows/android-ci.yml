name: Android validation
on:
  push:
    branches: [main, android/cc2-foundation, 'claude/**']
    paths: ['android/**', 'slicer/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', 'slicer/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch replaces a run still going: only the latest commit's result matters.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle   # Gradle's dependencies and wrapper, kept between runs
      # Robolectric downloads its Android libraries (android-all) at test time from Maven Central; kept between runs so a
      # download blip there no longer fails every Robolectric test.
      - name: Keep Robolectric's Android libraries
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/app/build.gradle', 'android/tv/build.gradle') }}
          restore-keys: robolectric-
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: The pinned slicer engine matches the engine source
        run: python3 ../.github/workflows/check-engine.py
      - name: Compile, test, lint and assemble
        run: |
          build() { ./gradlew --no-daemon --no-build-cache --max-workers=2 testDebugUnitTest lintDebug assembleDebug; }
          if build; then exit 0; fi
          # Only a failed download of Robolectric's Android libraries is retried, once; a failing test never is.
          if grep -lq 'MavenArtifactFetcher' app/build/test-results/testDebugUnitTest/*.xml tv/build/test-results/testDebugUnitTest/*.xml 2>/dev/null; then
            echo "::warning::Robolectric could not download its Android libraries (Maven Central); retrying once."
            build
          else
            exit 1
          fi
      - name: Keep the test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/tv/build/reports/tests/testDebugUnitTest
          retention-days: 7
      - name: The APK carries the slicer engine and its presets
        run: python3 ../.github/workflows/check-engine.py app/build/outputs/apk/debug/app-debug.apk
      - name: Keep the debug APK for testing on a phone
        uses: actions/upload-artifact@v4
        with:
          name: link-workshop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # The pages are checked on the Chromium that Playwright pins, not the runner's own Chrome: that one changes under
      # us, and Chrome 158's software 3D lost its context mid-check (the drawing went blank).
      - name: Keep Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium
      - name: The toolpath viewer, camera and plate pages work in a browser
        run: |
          npm install --no-save --no-package-lock --silent playwright@1.56.1
          npx playwright install chromium
          node tools/viewer-check.js
          node tools/camera-check.js
          node tools/plate-check.js
      - name: Report validation totals
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if reports:
              totals = {key: sum(int(ET.parse(p).getroot().get(key, '0')) for p in reports) for key in ['tests', 'failures', 'errors', 'skipped']}
              print('JVM totals:', totals)
          else:
              print('No completed JVM reports')
          lint = Path('app/build/reports/lint-results-debug.xml')
          if lint.exists():
              issues = ET.parse(lint).getroot().findall('issue')
              print('Lint:', {severity: sum(i.get('severity') == severity for i in issues) for severity in ['Error', 'Warning']})
          else:
              print('No completed lint report')
          PY
